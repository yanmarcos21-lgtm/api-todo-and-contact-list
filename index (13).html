<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lista de contactos</title>
<style>
:root{--bg:#e8cd68;--card:#fff;--text:#222;--muted:#6b6b6b;--btn:#0d6efd;--danger:#d63a3a;--tile:#3b8cf5;--ink:#1a1a1a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
main{max-width:480px;margin:0 auto;padding:16px;text-align:center}
.icons{display:grid;grid-template-columns:repeat(2,52px);gap:6px;justify-content:center;margin-top:8px}
.icons span{height:52px;border:3px solid var(--ink);border-radius:8px;background:var(--tile);display:grid;place-items:center;font-size:26px}
h1{color:#fff;margin:20px 0 16px;font-size:1.8rem}
input[type=text],input[type=tel]{display:block;width:100%;max-width:340px;margin:0 auto 10px;padding:10px;border:1px solid #ccc;border-radius:4px;font-size:1rem;background:var(--card);color:var(--text)}
.radios{display:flex;gap:18px;justify-content:center;margin:6px 0 12px;color:var(--ink)}
.radios label{display:flex;align-items:center;gap:6px}
button.add{background:var(--btn);color:#fff;border:0;border-radius:4px;padding:8px 16px;font-size:1rem;cursor:pointer}
#error{color:#7a1010;min-height:1.2em;margin:8px 0 0;font-size:.9rem}
ul{list-style:none;padding:0;margin:16px auto 0;max-width:340px;text-align:left}
li{background:var(--card);border-radius:6px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px;align-items:center}
li small{display:block;color:var(--muted)}
li button{background:var(--danger);color:#fff;border:0;border-radius:4px;padding:6px 10px;cursor:pointer}
.empty{color:var(--ink);text-align:center}
</style>
</head>
<body>
<main>
  <div class="icons"><span>📞</span><span>＠</span><span>✉️</span><span>👆</span></div>
  <h1>Lista de contactos</h1>
  <input id="name" type="text" placeholder="Ingresa tu nombre">
  <input id="lastname" type="text" placeholder="Ingresa tu apellido">
  <input id="phone" type="tel" placeholder="Ingresa tu teléfono">
  <input id="city" type="text" placeholder="Ingresa tu ciudad">
  <input id="address" type="text" placeholder="Ingresa tu dirección">
  <div class="radios">
    <label><input type="radio" name="gender" value="Femenino"> Femenino</label>
    <label><input type="radio" name="gender" value="Masculino"> Masculino</label>
  </div>
  <button class="add" id="add">AGREGAR</button>
  <p id="error"></p>
  <ul id="list"></ul>
</main>
<script>
var contacts=[];
try{contacts=JSON.parse(localStorage.getItem("contacts")||"[]")}catch(e){contacts=[]}
var ids=["name","lastname","phone","city","address"];
function save(){try{localStorage.setItem("contacts",JSON.stringify(contacts))}catch(e){}}
function render(){
  var ul=document.getElementById("list");ul.innerHTML="";
  if(!contacts.length){ul.innerHTML='<p class="empty">Aún no hay contactos.</p>';return}
  contacts.forEach(function(c,i){
    var li=document.createElement("li");
    var d=document.createElement("div");
    var b=document.createElement("strong");b.textContent=c.name+" "+c.lastname;
    var s=document.createElement("small");s.textContent=c.phone+" · "+c.city+" · "+c.address+(c.gender?" · "+c.gender:"");
    d.appendChild(b);d.appendChild(s);
    var x=document.createElement("button");x.textContent="Eliminar";
    x.onclick=function(){contacts.splice(i,1);save();render()};
    li.appendChild(d);li.appendChild(x);ul.appendChild(li);
  });
}
document.getElementById("add").onclick=function(){
  var c={};
  ids.forEach(function(id){c[id]=document.getElementById(id).value.trim()});
  var g=document.querySelector('input[name="gender"]:checked');
  c.gender=g?g.value:"";
  var err=document.getElementById("error");
  if(ids.some(function(id){return !c[id]})||!c.gender){err.textContent="Por favor completa todos los campos.";return}
  err.textContent="";
  contacts.push(c);save();render();
  ids.forEach(function(id){document.getElementById(id).value=""});
  if(g)g.checked=false;
};
render();
</script>
</body>
</html>
